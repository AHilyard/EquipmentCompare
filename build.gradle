plugins {
	id 'io.github.goooler.shadow' version '8.1.7' apply false
	id 'dev.architectury.loom' version '1.13-SNAPSHOT' apply false
	id 'architectury-plugin' version '3.4-SNAPSHOT'
}

apply plugin: 'architectury-plugin'

architectury {
	minecraft = project.minecraftVersion
}

allprojects {
	group = rootProject.group
	version = rootProject.modVersion
}

subprojects {
	apply plugin: 'dev.architectury.loom'
	apply plugin: 'architectury-plugin'

	base {
		archivesName = "$rootProject.name-$rootProject.minecraftVersion-$project.name"
	}

	repositories {
		maven {
			name = "CurseMaven"
			url = "https://www.cursemaven.com"
		}
		maven {
			name = "LadySnake"
			url = 'https://maven.ladysnake.org/releases'
		}
	}

	dependencies {
		minecraft "net.minecraft:minecraft:$rootProject.minecraftVersion"
		mappings loom.officialMojangMappings()

		modImplementation files("../libs/Iceberg-1.21.11-common-1.4.0.2.jar")
		modImplementation files("../libs/LegendaryTooltips-1.21.11-common-1.6.0.jar")

		// These mods do not have a 1.21.11 version - keeping only for compilation.
		modCompileOnly "curse.maven:accessories-938917:5576244"
		modCompileOnly "curse.maven:accessoriestrinkets-1005680:5575593"

		modImplementation "curse.maven:curios-309927:7642217"
		modImplementation("org.ladysnake.cardinal-components-api:cardinal-components-base:7.3.2")
		modImplementation("org.ladysnake.cardinal-components-api:cardinal-components-entity:7.3.2")
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_21
		targetCompatibility = JavaVersion.VERSION_21
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 21
	}

	remapJar {
		destinationDirectory = file("$buildDir/../../output")
	}
}
